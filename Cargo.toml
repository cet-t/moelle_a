[package]
name = "fil_a"
version = "0.1.0"
edition = "2024"

[dependencies]
fil = "0.1.0"
bytemuck = { version = "1.25", optional = true }
pastey = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
splitmix = "0.1.0"

[dev-dependencies]
cribler_testu01 = { path = "../cribler_testu01" }
cribler_practrand = { path = "../cribler_practrand" }

[features]
serde = ["dep:serde"]
full = [
  "biski",
  "jsf",
  "mt",
  "sfmt",
  "tgfsr",
  "wyhash",
  "xorwow",
  "sfc",
  "squares",
]
biski = []
jsf = []
mt = []
sfmt = ["dep:bytemuck", "dep:pastey"]
tgfsr = []
wyhash = []
xorwow = []
sfc = []
squares = []
